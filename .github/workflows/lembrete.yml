name: Lembrete diário
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar lembretes desta hora
        env:
          S: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$S" ]; then echo "CRON_SECRET ainda não configurado; nada a fazer."; exit 0; fi
          curl -fsS -X POST "https://reflexao-biblica.pages.dev/api/cron" -H "x-cron-secret: $S"
